name: myfirst-workflow
#to get a triggeron every push in this repo in every branch
on:
 push: 

jobs:
  firstJob:
   name: job1
   runs-on: windows-latest
   steps:
    - name: Step-1
      run: |
       pwd
       hostname
    - name: Step-2 - Checkout
      uses: actions/checkout@v7.0.1
    - name: Step-3
      run: |
       echo 'pwd' >>myartifacts.txt
       hostname
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
       name: single_file
       path: ./myartifact.txt
       
