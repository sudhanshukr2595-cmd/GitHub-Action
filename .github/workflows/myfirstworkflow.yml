name: myfirstworkflow
#to get a triggeron every push in this repo in every branch
on:
 push:
  branches: 
   - main
 pull_request:
  branches:
   - main
env:
 ENV_TYPE: DEV 
 APP_USER: thinknyx
 APP_PORT: 80
 
jobs:
  firstJob:
   name: job1
   runs-on: windows-latest
   steps:
    - name: Step-1
      run: |
       pwd
       hostname
    - name: Step-2 - Checkout
      uses: actions/checkout@v7.0.1
    - name: Step-3
      run: |
       echo 'pwd' >>myartifacts.txt
       mkdir artifacts
       echo 'ls -ltr' >>artifacts/list.txt
       echo 'hostname' >>artifacts/hostname.txt
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
       name: single_file
       path: ./myartifact.txt
  secondjob:
   name: JOB2
   runs-on: ubuntu-latest
   steps:
    - name: checking current directory
      run:
       pwd
       ls -ltr
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
       name: single_file
       path: ./myartifact.txt
    - name: referring Environment Variable
      run: |
       echo"[INFO] running Deployment for $ENV_TYPE with user $APP_USER."
       echo "[INFO] once deployed app is accessiable on port $APP_PORT"
    - name: Referring Repository Secrets
      run: |
       echo"[INFO] Application password is ${{ secrets.$APP_PASSWORD }}"
