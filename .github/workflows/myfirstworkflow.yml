name: myfirstworkflow
#to get a triggeron every push in this repo in every branch
on:
 push: 

jobs:
  firstJob:
   name: job1
   runs-on: windows-latest
   steps:
    - name: Step-1
      run: |
       pwd
       hostname
    - name: Step-2 - Checkout
      uses: actions/checkout@v7.0.1
    - name: Step-3
      run: |
       echo 'pwd' >>myartifacts.txt
       mkdir artifacts
       echo 'ls -ltr' >>artifacts/list.txt
       echo 'hostname' >>artifacts/hostname.txt
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
       name: single_file
       path: ./myartifact.txt
    - name: Upload from directory
      uses: actions/upload-artifact@v7.0.1
      with:
       name: directory_artifacts
       path: artifacts/
       uses: actions/upload-artifact@v7.0.1
    - name: Upload from multiple paths
      uses: actions/upload-artifact@v7.0.1
      with:
       name: multiple_paths_with_exclusions
       path:
        ./myartifact.txt
  secondjob:
   name: JOB2
   runs-on: ubuntu-latest
   steps:
    - name: checking current directory
      run:
       pwd
       ls -ltr
    - name: Download single file artifact
      uses: actions/download-artifact@v3.1.0
      with:
       name: single file
    - name: checking current directory post download
      run:
       pwd
       ls -ltr
        artifacts/
        !**/hostname.txt
       
